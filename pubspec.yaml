name: geocoder_pro
description: A powerful Flutter package for forward and reverse geocoding with Google Maps and free OpenStreetMap (Nominatim), spatial distance, and address utilities.
version: 1.1.0
homepage: https://github.com/rohitsoni9/geocoder_pro
repository: https://github.com/rohitsoni9/geocoder_pro
issue_tracker: https://github.com/rohitsoni9/geocoder_pro/issues

topics:
  - geocoding
  - reverse-geocoding
  - google-maps
  - openstreetmap
  - geolocation

environment:
  sdk: ^3.7.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
